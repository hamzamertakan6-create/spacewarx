name: SpaceWarx CI-CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodu GitHub sunucusuna çekiyoruz
    - name: Repository'i Klonla
      uses: actions/checkout@v4

    # 2. Python Kurulumu
    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    # 3. Bağımlılıkları Yükle (Eğer requirements.txt varsa yükler, yoksa hata vermeden geçer)
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Projedeki fonts ve assets klasörlerini kontrol et ve arşivle
    - name: Proje Çıktılarını Zip Yap
      run: |
        echo "Dosyalar paketleniyor..."
        zip -r SpaceWarx_Release.zip fonts assets gen_assets.py buildozer.spec || echo "Bazı dosyalar eksik ama zip oluşturuluyor..."
        zip -u SpaceWarx_Release.zip *.py || echo "Ekstra Python dosyaları eklendi."

    # 5. Oluşan Zip dosyasını GitHub üzerinde indirilebilir bir "Artifact" yap
    - name: Çıktıyı Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: SpaceWarx-Build-Paketi
        path: SpaceWarx_Release.zip
